# HappyMonkey AI Swarm Support Stack — component catalogue
# install.sh reads this file. Keep paths relative and secrets out of this file.
#
# Product intent: one installable plane so a driver model can plan and fan work
# out to CLI coding agents that claim tasks from a shared board.
#
# tiers:
#   swarm     — coordination plane (default install)
#   research  — optional planning/research MCPs for the driver
#   data      — optional public-data MCPs
#   incubating — real repos, not ready to treat as stable swarm deps
#
# kind:
#   mcp_python_uv  — uv project with pyproject.toml
#   mcp_python_pip — venv + requirements.txt / pip install
#   prompts        — markdown / yaml templates only (no runtime server)
#   proxy          — DynamicMCPProxy (lazy tool gateway)
#   other          — special-cased / manual

version: 2
default_profile: swarm
org: HappyMonkeyAI
default_root: "${HOME}/happymonkey"
product_name: AI Swarm Support Stack

profiles:
  # Default: pieces that are designed to work together for multi-agent builds
  swarm:
    description: >-
      Driver + CLI swarm support plane — task board, locks, CLI profiles,
      coordination MCPs, project registry, resource admission, lazy tool proxy,
      local user context, and Agents Protocol patterns.
    components:
      - ai-agent-teamwork-prompt
      - agents-protocol
      - agent-coordination-mcp
      - agent-communication-mcp
      - launcher-project-registry
      - resource-sentinel-mcp
      - user-context-mcp
      - dynamic-mcp-proxy

  # Back-compat alias
  core:
    description: Alias of swarm (kept for older install commands)
    extends: swarm

  # Driver overlays — useful while planning, not required to run a swarm
  research:
    description: Swarm + article/social research MCPs for the planning driver
    extends: swarm
    components:
      - article-research-mcp
      - social-research-mcp
      - devto-mcp-server

  data:
    description: Swarm + UK/US public-data MCPs
    extends: swarm
    components:
      - openuk-public-data-mcp
      - openus-public-data-mcp

  # Everything stable enough to list (still excludes incubating)
  full:
    description: Swarm + research + data + stable optional ops helpers
    extends: [swarm, research, data]
    components:
      - ai-google-analytics-mcp
      - linux-maintenance

  # Explicit opt-in for unfinished pieces — never default
  incubating:
    description: In-development tools (Keymaster, etc.) — clone only, no promises
    components:
      - keymaster-mcp

components:
  # ---------------------------------------------------------------------------
  # SWARM PLANE — designed to compose
  # ---------------------------------------------------------------------------

  ai-agent-teamwork-prompt:
    name: AI Agent Teamwork
    tier: swarm
    kind: prompts
    repo: HappyMonkeyAI/ai-agent-teamwork-prompt
    dir: ai-agent-teamwork-prompt
    role: >-
      Shared task board, file locks, project/agent bootstrap prompts, and CLI
      profile YAML (codex/agy/opencode/grok/hermes/kiro). This is the swarm's
      ground truth on disk — MCP layers read/adapt it; they do not replace it.
    description: Swarm templates + CLI agent profiles for multi-agent builds
    tags: [prompts, swarm, profiles, cli-agents, task-board]
    install:
      need: [git]
      sync: none
      markers: [profiles, templates]
    hermes:
      register: false
    env_hints:
      - AGENT_CLI_PROFILES_DIR
    wires_to:
      - agent-coordination-mcp
      - agent-communication-mcp
      - agents-protocol

  agents-protocol:
    name: Agents Protocol
    tier: swarm
    kind: prompts
    repo: HappyMonkeyAI/AgentsProtocol
    dir: AgentsProtocol
    role: >-
      High-velocity agent operating rules (AGENTS.md, LTM, pre-mortem, ratchet).
      Complements teamwork bootstrap with protocol depth for Antigravity/IDE agents.
    description: High-velocity agent protocol (AGENTS.md, LTM, pre-mortem patterns)
    tags: [prompts, protocol, antigravity, swarm]
    install:
      need: [git]
      sync: none
      markers: [AGENTS.md]
    hermes:
      register: false
    wires_to:
      - ai-agent-teamwork-prompt

  agent-coordination-mcp:
    name: Agent Coordination MCP
    tier: swarm
    kind: mcp_python_uv
    repo: HappyMonkeyAI/agent-coordination-mcp
    dir: agent-coordination-mcp
    role: >-
      MCP control plane over the file-based teamwork board — list CLIs, inspect
      project coordination state, record assignments. Does not replace locks/tasks.py.
    description: File-based task board / lock coordination control plane for CLI agents
    tags: [mcp, coordination, task-board, swarm]
    install:
      need: [git, uv]
      sync: uv sync
      markers: [pyproject.toml]
    hermes:
      register: true
      server_name: agent_coordination
      entrypoints:
        - "agent-coordination-mcp"
    catalogue_name: agent_coordination
    wires_to:
      - ai-agent-teamwork-prompt
      - agent-communication-mcp
      - dynamic-mcp-proxy

  agent-communication-mcp:
    name: Agent Communication MCP
    tier: swarm
    kind: mcp_python_uv
    repo: HappyMonkeyAI/AgentCommunicationMCP
    dir: agent-communication-mcp
    role: >-
      Cross-agent mailbox / A2A-shaped tasks, CLI provider readiness
      (from teamwork profiles), control-center view. Driver uses this to see
      who is ready and to hand work between server/dev/desktop agents.
    description: Authenticated LAN coordination — A2A tasks, provider readiness, control center
    tags: [mcp, a2a, coordination, swarm]
    install:
      need: [git, uv]
      sync: uv sync
      markers: [pyproject.toml]
    hermes:
      register: true
      server_name: agent_communication
      entrypoints:
        - scripts/run_stdio.py
        - "python -m agent_communication"
    catalogue_name: agent_communication
    env_hints:
      - LAUNCHER_REGISTRY_PATH
      - AGENT_CLI_PROFILES_DIR
    wires_to:
      - launcher-project-registry
      - ai-agent-teamwork-prompt
      - resource-sentinel-mcp

  launcher-project-registry:
    name: Launcher Project Registry
    tier: swarm
    kind: mcp_python_pip
    repo: HappyMonkeyAI/launcher-project-registry
    dir: launcher-project-registry
    role: >-
      Shared project map (paths, ports, tech stack, CONTEXT.md). Swarm agents and
      Agent Communication resolve "which repo / which port" here instead of guessing.
    description: Project registry — paths, ports, tech stacks, CONTEXT.md for agents
    tags: [mcp, registry, ports, projects, swarm]
    install:
      need: [git, python3]
      sync: venv_pip
      requirements: requirements.txt
      markers: [requirements.txt, mcp-server]
    hermes:
      register: true
      server_name: launcher_registry
      command_template: "${ROOT}/${DIR}/venv/bin/python"
      args_template:
        - "${ROOT}/${DIR}/mcp-server/stdio_server.py"
    catalogue_name: launcher_registry
    env_hints:
      - LAUNCHER_REGISTRY_PATH
    wires_to:
      - agent-communication-mcp
      - dynamic-mcp-proxy

  resource-sentinel-mcp:
    name: Resource Sentinel MCP
    tier: swarm
    kind: mcp_python_uv
    repo: HappyMonkeyAI/Resource-Sentinel-MCP
    dir: Resource-Sentinel-MCP
    role: >-
      Host telemetry + lease admission so the driver does not spawn N heavy CLI
      agents into an already saturated box. Swarm scale safety valve.
    description: Host telemetry + lease-based admission for heavy agent workloads
    tags: [mcp, resources, leases, telemetry, swarm]
    install:
      need: [git, uv]
      sync: uv sync
      markers: [pyproject.toml, src/resource_sentinel]
    hermes:
      register: true
      server_name: resource_sentinel
      entrypoints:
        - "fastmcp run src/resource_sentinel/server.py:mcp"
    catalogue_name: resource_sentinel
    wires_to:
      - agent-communication-mcp
      - dynamic-mcp-proxy

  user-context-mcp:
    name: User Context MCP
    tier: swarm
    kind: mcp_python_uv
    repo: HappyMonkeyAI/UserContextMCPServer
    dir: user-context-mcp
    role: >-
      Local stack/repos/communication prefs for subagent bootstrap so workers
      inherit the same operator context without pasting walls of prose.
    description: Local developer context for subagent bootstrap
    tags: [mcp, context, bootstrap, swarm]
    install:
      need: [git, uv]
      sync: uv_or_venv
      markers: [server.py]
      post:
        - copy_context_examples
    hermes:
      register: true
      server_name: user_context
      entrypoints:
        - server.py
    catalogue_name: user_context
    env_hints:
      - USER_CONTEXT_ROOT
    wires_to:
      - agent-communication-mcp
      - ai-agent-teamwork-prompt

  dynamic-mcp-proxy:
    name: DynamicMCPProxy
    tier: swarm
    kind: proxy
    repo: HappyMonkeyAI/DynamicMCPProxy
    mirror_urls:
      - https://github.com/HappyMonkeyAI/DynamicMCPProxy.git
      - https://github.com/SPhillips1337/DynamicMCPProxy.git
    dir: DynamicMCPProxy
    role: >-
      Single IDE entry that lazily mounts the swarm MCPs (and others) under a
      tool-count budget. Keeps Hermes/Antigravity/Claude from drowning in tools.
    description: Lazy MCP gateway — rotating tool belt under ~50-tool IDE budgets
    tags: [mcp, proxy, lazy-load, gateway, swarm]
    install:
      need: [git, uv]
      sync: uv sync
      markers: [pyproject.toml, catalogue.json]
    hermes:
      # Clients often talk only to the proxy; catalogue mounts the rest.
      register: false
    catalogue_name: dynamic_proxy
    wires_to:
      - agent-coordination-mcp
      - agent-communication-mcp
      - launcher-project-registry
      - resource-sentinel-mcp
      - user-context-mcp

  # ---------------------------------------------------------------------------
  # DRIVER OVERLAYS — planning helpers, not swarm glue
  # ---------------------------------------------------------------------------

  article-research-mcp:
    name: Article Research MCP
    tier: research
    kind: mcp_python_uv
    repo: HappyMonkeyAI/article-research-mcp
    dir: article-research-mcp
    role: Planning briefs (dev.to/HN/RSS) for the driver before fan-out.
    description: Article/tutorial research for planning — dev.to, HN, RSS, ranked briefs
    tags: [mcp, research, articles, planning]
    install:
      need: [git, uv]
      sync: uv sync
      markers: [pyproject.toml]
    hermes:
      register: true
      server_name: article_research
      entrypoints:
        - article-research-mcp
    catalogue_name: article_research
    env_hints:
      - OPENAI_COMPAT_BASE_URL
      - OPENAI_COMPAT_API_KEY
      - OPENAI_COMPAT_MODEL
      - ARTICLE_RESEARCH_ROOT

  social-research-mcp:
    name: Social Research MCP
    tier: research
    kind: mcp_python_uv
    repo: HappyMonkeyAI/social-research-mcp
    dir: social-research-mcp
    role: Social trend signals for content/planning drivers.
    description: Social trend research for content planning
    tags: [mcp, research, social, content]
    install:
      need: [git, uv]
      sync: uv sync
      markers: [pyproject.toml]
    hermes:
      register: true
      server_name: social_research
    catalogue_name: social_research

  devto-mcp-server:
    name: dev.to MCP Server
    tier: research
    kind: mcp_python_uv
    repo: HappyMonkeyAI/devto-mcp-server
    dir: devto-mcp-server
    role: Thin dev.to API; prefer article-research-mcp for ranked planning briefs.
    description: Thin dev.to API MCP
    tags: [mcp, devto, research]
    install:
      need: [git, uv]
      sync: uv sync
      markers: [pyproject.toml]
    hermes:
      register: true
      server_name: devto
      entrypoints:
        - devto-mcp-server
    catalogue_name: devto

  openuk-public-data-mcp:
    name: Open UK Public Data MCP
    tier: data
    kind: mcp_python_uv
    repo: HappyMonkeyAI/OpenUKPublicDataMCP
    dir: OpenUKPublicDataMCP
    role: Domain data tools when a swarm build needs UK public data.
    description: No-key-first UK public data MCP
    tags: [mcp, uk, open-data]
    install:
      need: [git, uv]
      sync: uv sync
      markers: [pyproject.toml]
    hermes:
      register: true
      server_name: openukpublicdata
      entrypoints:
        - openukpublicdata-mcp
    catalogue_name: openukpublicdata

  openus-public-data-mcp:
    name: Open US Public Data MCP
    tier: data
    kind: mcp_python_uv
    repo: HappyMonkeyAI/OpenUSPublicDataMCP
    dir: OpenUSPublicDataMCP
    role: Domain data tools when a swarm build needs US public data.
    description: Federal-first US public data MCP
    tags: [mcp, us, open-data]
    install:
      need: [git, uv]
      sync: uv sync
      markers: [pyproject.toml]
    hermes:
      register: true
      server_name: openuspublicdata
    catalogue_name: openuspublicdata

  ai-google-analytics-mcp:
    name: AI Google Analytics MCP
    tier: optional
    kind: mcp_python_uv
    repo: HappyMonkeyAI/ai-google-analytics-mcp
    dir: ai-google-analytics-mcp
    role: Optional GA4 provisioning for shipped web apps — not swarm coordination.
    description: Provision GA4 properties/streams for local AI/web projects
    tags: [mcp, analytics, ga4]
    install:
      need: [git, uv]
      sync: uv sync
      markers: [pyproject.toml]
    hermes:
      register: false
    catalogue_name: ai_google_analytics

  linux-maintenance:
    name: Linux Maintenance
    tier: optional
    kind: other
    repo: HappyMonkeyAI/LinuxMaintenance.sh
    dir: LinuxMaintenance.sh
    role: Host hygiene helper; not part of swarm messaging.
    description: Simple Linux maintenance script companion
    tags: [ops, shell]
    install:
      need: [git]
      sync: none
    hermes:
      register: false

  # ---------------------------------------------------------------------------
  # INCUBATING — real repos, not swarm defaults
  # ---------------------------------------------------------------------------

  keymaster-mcp:
    name: Keymaster MCP
    tier: incubating
    kind: other
    repo: HappyMonkeyAI/keymasterMCP
    dir: keymasterMCP
    role: >-
      Future secrets plane (vault + proxy so agents avoid raw .env). Promising
      for swarm security, still in development — install profile=incubating only.
    description: Credential vault / proxy (MCP-first; still maturing)
    tags: [mcp, secrets, vault, incubating]
    install:
      need: [git]
      sync: none
      markers: []
    hermes:
      register: false
    notes: Not part of default swarm. PHP/runtime setup separate; do not auto-register.
